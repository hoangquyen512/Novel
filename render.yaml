# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: novel-downloader
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: Qin@123456789
      - key: ADMIN_SESSION_SECRET
        value: 4b03cea8cc04bb53352b173e683c17eb9d6aef88b8114796
