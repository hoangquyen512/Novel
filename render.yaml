# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: novel-downloader
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
